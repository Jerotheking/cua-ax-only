deny:
  tools: [double_click, drag, bring_to_front, run_script,
          replay_trajectory, kill_app, set_config,
          page, start_recording, install_extension, install_ffmpeg, escalate_session,
          clipboard_read, clipboard_write]
allow:
  tools: [run_steps, get_window_state, get_accessibility_tree, get_screen_size, get_desktop_state,
          get_cursor_position, list_apps, list_windows, list_sessions, get_session,
          get_session_state, get_config, get_browser_state, get_guide, get_agent_cursor_state,
          get_recording_state, verify_state, zoom, parse_visual_regions, check_permissions,
          check_for_update, health_report, launch_app, end_session, start_session,
          stop_recording, set_agent_cursor_enabled, set_agent_cursor_motion,
          set_agent_cursor_theme, browser_click, browser_dialog, browser_download,
          browser_navigate, browser_pointer, browser_prepare, browser_select,
          browser_set_input_files, browser_type]
  rules:
    - tool: press_key
      constraints:
        delivery_mode: {allowed: ["background"]}
        scope: {allowed: ["window"]}
        pid: {min: 1}
    - tool: hotkey
      constraints:
        delivery_mode: {allowed: ["background"]}
        scope: {allowed: ["window"]}
        pid: {min: 1}
    - tool: invoke_menu
      constraints:
        pid: {min: 1}
    - tool: set_window_frame
      constraints:
        pid: {min: 1}
        window_id: {min: 1}
    - tool: move_cursor
      constraints:
        scope: {allowed: ["window"]}
    - tool: click
      constraints:
        element_token: {pattern: ".+"}
        delivery_mode: {allowed: ["background"]}
    - tool: type_text
      constraints:
        element_token: {pattern: ".+"}
        delivery_mode: {allowed: ["background"]}
    - tool: set_value
      constraints:
        element_token: {pattern: ".+"}
    - tool: scroll
      constraints:
        element_token: {pattern: ".+"}
        window_id: {min: 1}
        delivery_mode: {allowed: ["background"]}
    - tool: right_click
      constraints:
        element_token: {pattern: ".+"}
        delivery_mode: {allowed: ["background"]}
